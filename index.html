<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gösterge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#000000;
    --surface:#0C0D0F;
    --line: rgba(255,255,255,0.09);
    --cyan:#00E5FF;
    --amber:#FFB020;
    --red:#FF3B30;
    --text:#F5F6F7;
    --text-dim:#84878C;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }

  .app{ max-width:420px; margin:0 auto; padding:env(safe-area-inset-top,18px) 18px calc(env(safe-area-inset-bottom,18px) + 20px); }

  .topbar{ display:flex; justify-content:space-between; align-items:center; padding:2px 2px 14px; }
  .brand{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.18em; color:var(--text-dim); }
  .clock{ font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--text-dim); }

  /* ---- speedometer stage ---- */
  .speedo-stage{ position:relative; width:300px; height:300px; margin:0 auto; }
  .speedo-stage svg{ width:100%; height:100%; overflow:visible; }
  .speedo-center{
    position:absolute; left:0; right:0; top:50%; transform:translateY(6%);
    text-align:center; pointer-events:none;
  }
  .speedo-value{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:64px; line-height:1; letter-spacing:-0.01em; }
  .speedo-unit{ font-family:'Rajdhani',sans-serif; font-size:14px; font-weight:600; letter-spacing:0.12em; color:var(--text-dim); margin-top:2px; }

  .speedo-stats{
    display:flex; align-items:center; justify-content:center; gap:22px;
    margin-top:-6px; margin-bottom:18px;
  }
  .stat{ text-align:center; }
  .stat-v{ display:block; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; }
  .stat-l{ display:block; font-size:11px; color:var(--text-dim); margin-top:1px; }
  .stat-divider{ width:1px; height:26px; background:var(--line); }

  .track-btn{
    appearance:none; border:none; cursor:pointer; width:100%;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:17px; letter-spacing:0.04em;
    padding:15px; border-radius:14px;
    background:var(--cyan); color:#00181C;
    transition:transform 0.15s, background 0.3s, color 0.3s;
  }
  .track-btn:active{ transform:scale(0.97); }
  .track-btn.tracking{ background:var(--red); color:#2A0402; }

  .track-note{ text-align:center; font-size:12px; color:var(--text-dim); margin-top:9px; min-height:15px; }
  .track-note.err{ color:var(--red); }

  /* ---- tabs ---- */
  .tabbar{ display:flex; gap:6px; margin-top:26px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:4px; }
  .tab{
    flex:1; appearance:none; border:none; cursor:pointer; background:transparent;
    color:var(--text-dim); font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding:9px 4px; border-radius:9px; transition:background 0.2s, color 0.2s;
  }
  .tab.active{ background:#1B1C1F; color:var(--text); }

  .panel{ display:none; padding-top:18px; }
  .panel.active{ display:block; }

  /* ---- rows / lists ---- */
  .row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 2px; border-bottom:1px solid var(--line); font-size:14px;
  }
  .row:last-child{ border-bottom:none; }
  .row .k{ color:var(--text-dim); }
  .row .v{ font-weight:500; text-align:right; max-width:60%; }

  .metric-grid{ display:flex; gap:10px; margin-bottom:16px; }
  .metric{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:14px 10px; text-align:center;
  }
  .metric .v{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:24px; }
  .metric .l{ font-size:11px; color:var(--text-dim); margin-top:3px; }

  .btn-line{
    appearance:none; border:1px solid var(--line); cursor:pointer; width:100%;
    background:var(--surface); color:var(--text); font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    padding:13px; border-radius:12px; margin-top:4px; transition:opacity 0.2s;
  }
  .btn-line:disabled{ opacity:0.5; }
  .btn-line.accent{ background:var(--cyan); color:#00181C; border-color:transparent; }

  .progress-track{ height:4px; background:var(--surface); border-radius:4px; overflow:hidden; margin:12px 0 4px; }
  .progress-fill{ height:100%; width:0%; background:var(--cyan); transition:width 0.3s; }

  .hint{ font-size:12px; color:var(--text-dim); text-align:center; margin-top:6px; min-height:15px; }
  .hint.err{ color:var(--red); }

  .place-line{ font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700; }
  .place-sub{ font-size:12.5px; color:var(--text-dim); margin-top:2px; margin-bottom:14px; }

  .weather-mini{ display:flex; align-items:center; gap:12px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .weather-mini svg{ width:34px; height:34px; flex-shrink:0; }
  .weather-mini .t{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px; }
  .weather-mini .d{ font-size:12px; color:var(--text-dim); }

  footer{ text-align:center; font-size:11px; color:var(--text-dim); opacity:0.55; padding:22px 0 4px; letter-spacing:0.05em; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">GÖSTERGE</div>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <div class="speedo-stage">
    <svg viewBox="0 0 300 300">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path id="redlineArc" fill="none" stroke="rgba(255,59,48,0.35)" stroke-width="14" stroke-linecap="round"/>
      <path id="trackArc" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="14"/>
      <path id="progressArc" fill="none" stroke="var(--cyan)" stroke-width="14" stroke-linecap="round"
            pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" filter="url(#glow)"
            style="transition: stroke-dashoffset 0.5s cubic-bezier(.34,1.2,.4,1), stroke 0.3s;"/>
      <g id="ticks"></g>
      <circle cx="150" cy="150" r="9" fill="#1B1C1F" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <line id="needle" x1="150" y1="150" x2="150" y2="62" stroke="var(--cyan)" stroke-width="3.5" stroke-linecap="round"
            transform="rotate(-135 150 150)" filter="url(#glow)"
            style="transition: transform 0.5s cubic-bezier(.34,1.2,.4,1), stroke 0.3s;"/>
    </svg>
    <div class="speedo-center">
      <div class="speedo-value" id="vehicleSpeedValue">0</div>
      <div class="speedo-unit">KM/S</div>
    </div>
  </div>

  <div class="speedo-stats">
    <div class="stat"><span class="stat-v" id="vehicleMax">0</span><span class="stat-l">en yüksek</span></div>
    <div class="stat-divider"></div>
    <div class="stat"><span class="stat-v" id="vehicleAcc">—</span><span class="stat-l">GPS doğruluğu</span></div>
  </div>

  <button class="track-btn" id="vehicleBtn" onclick="toggleVehicleTracking()">Takibi Başlat</button>
  <div class="track-note" id="vehicleStatusLine">Telefonu sabitle, ekranı açık tut.</div>

  <div class="tabbar">
    <button class="tab active" data-tab="net" onclick="switchTab('net')">İnternet</button>
    <button class="tab" data-tab="loc" onclick="switchTab('loc')">Konum</button>
    <button class="tab" data-tab="device" onclick="switchTab('device')">Cihaz</button>
  </div>

  <!-- NETWORK -->
  <section class="panel active" id="panel-net">
    <div class="metric-grid">
      <div class="metric"><div class="v" id="pingValue">—</div><div class="l">ping (ms)</div></div>
      <div class="metric"><div class="v" id="downValue">—</div><div class="l">indirme (Mbps)</div></div>
      <div class="metric"><div class="v" id="uploadValue">—</div><div class="l">yükleme (Mbps)</div></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="netProgress"></div></div>
    <button class="btn-line accent" id="speedBtn" onclick="runSpeedTest()">Hız Testini Başlat</button>
    <div class="hint" id="speedStatusLine">Hazır</div>
    <div class="row"><span class="k">IP adresi</span><span class="v" id="ipAddr">Yükleniyor…</span></div>
    <div class="row"><span class="k">Sağlayıcı (ISP)</span><span class="v" id="ipOrg">—</span></div>
  </section>

  <!-- LOCATION -->
  <section class="panel" id="panel-loc">
    <div id="locResult" style="display:none;">
      <div class="place-line" id="placeName">—</div>
      <div class="place-sub" id="placeCountry">—</div>
      <div class="row"><span class="k">Enlem</span><span class="v" id="latVal">—</span></div>
      <div class="row"><span class="k">Boylam</span><span class="v" id="lonVal">—</span></div>
      <div class="weather-mini" id="weatherMini" style="display:none;">
        <div id="weatherIconBox"></div>
        <div><div class="t"><span id="weatherTemp">—</span>°</div><div class="d" id="weatherDesc">—</div></div>
      </div>
    </div>
    <button class="btn-line accent" id="locBtn" onclick="getLocation()">Konumu Bul</button>
    <div class="hint" id="locStatusLine">Konumunu bulmak için izin ver.</div>
  </section>

  <!-- DEVICE -->
  <section class="panel" id="panel-device">
    <div id="deviceRows"></div>
  </section>

  <footer>GÖSTERGE · hız, konum ve ağ takip paneli</footer>
</div>

<script>
/* ===== Clock ===== */
function tickClock(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('tr-TR'); }
setInterval(tickClock,1000); tickClock();

/* ===== Tabs ===== */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+name));
}

/* ===== Gauge geometry ===== */
const CX=150, CY=150, R=110;
function polarToCartesian(cx,cy,r,angleDeg){
  const rad = angleDeg * Math.PI/180;
  return { x: cx + r*Math.sin(rad), y: cy - r*Math.cos(rad) };
}
function arcPath(cx,cy,r,startAngle,endAngle){
  const s = polarToCartesian(cx,cy,r,startAngle);
  const e = polarToCartesian(cx,cy,r,endAngle);
  const largeArc = (endAngle-startAngle) > 180 ? 1 : 0;
  return `M ${s.x} ${s.y} A ${r} ${r} 0 ${largeArc} 1 ${e.x} ${e.y}`;
}

const GAUGE_START = -135, GAUGE_END = 135, GAUGE_MAX = 200;
document.getElementById('trackArc').setAttribute('d', arcPath(CX,CY,R,GAUGE_START,GAUGE_END));
document.getElementById('progressArc').setAttribute('d', arcPath(CX,CY,R,GAUGE_START,GAUGE_END));
const REDLINE_FROM = 150; // km/h
document.getElementById('redlineArc').setAttribute('d',
  arcPath(CX,CY,R, GAUGE_START + (REDLINE_FROM/GAUGE_MAX)*270, GAUGE_END));

function buildTicks(){
  const g = document.getElementById('ticks');
  g.innerHTML = '';
  const minorStep = 10, majorStep = 20;
  for(let v=0; v<=GAUGE_MAX; v+=minorStep){
    const isMajor = v % majorStep === 0;
    const angle = GAUGE_START + (v/GAUGE_MAX)*270;
    const p1 = polarToCartesian(CX,CY, isMajor?96:100, angle);
    const p2 = polarToCartesian(CX,CY, 110, angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',p1.x); line.setAttribute('y1',p1.y);
    line.setAttribute('x2',p2.x); line.setAttribute('y2',p2.y);
    line.setAttribute('stroke', isMajor ? 'rgba(245,246,247,0.8)' : 'rgba(245,246,247,0.3)');
    line.setAttribute('stroke-width', isMajor ? 2.4 : 1.3);
    line.setAttribute('stroke-linecap','round');
    g.appendChild(line);
    if(isMajor){
      const lp = polarToCartesian(CX,CY,78,angle);
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x',lp.x); text.setAttribute('y',lp.y);
      text.setAttribute('text-anchor','middle');
      text.setAttribute('dominant-baseline','middle');
      text.setAttribute('fill','rgba(245,246,247,0.5)');
      text.setAttribute('font-size','11');
      text.setAttribute('font-family','Rajdhani, sans-serif');
      text.setAttribute('font-weight','600');
      text.textContent = v;
      g.appendChild(text);
    }
  }
}
buildTicks();

function setVehicleGauge(kmh){
  const pct = Math.min(Math.max(kmh,0) / GAUGE_MAX, 1);
  const angle = GAUGE_START + pct*270;
  const color = kmh >= REDLINE_FROM ? 'var(--red)' : kmh > 60 ? 'var(--amber)' : 'var(--cyan)';
  document.getElementById('needle').setAttribute('transform', `rotate(${angle} ${CX} ${CY})`);
  document.getElementById('needle').style.stroke = color;
  document.getElementById('progressArc').style.strokeDashoffset = 1000 - (1000*pct);
  document.getElementById('progressArc').style.stroke = color;
  document.getElementById('vehicleSpeedValue').textContent = Math.round(kmh);
  document.getElementById('vehicleSpeedValue').style.color = kmh >= REDLINE_FROM ? '#FF6B62' : '#F5F6F7';
}

/* ===== Vehicle live speed ===== */
let vehicleWatchId = null, vehicleLastPos = null, vehicleMaxKmh = 0, vehicleWakeLock = null;

function haversineMeters(lat1,lon1,lat2,lon2){
  const R2 = 6371000, toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R2 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function toggleVehicleTracking(){ vehicleWatchId===null ? startVehicleTracking() : stopVehicleTracking(); }

function startVehicleTracking(){
  const btn = document.getElementById('vehicleBtn');
  const note = document.getElementById('vehicleStatusLine');
  if(!navigator.geolocation){ note.textContent='Bu cihaz konum servisini desteklemiyor.'; note.classList.add('err'); return; }
  vehicleMaxKmh = 0; vehicleLastPos = null;
  btn.textContent = 'Takibi Durdur'; btn.classList.add('tracking');
  note.classList.remove('err'); note.textContent = 'GPS sinyali bekleniyor…';
  if('wakeLock' in navigator){ navigator.wakeLock.request('screen').then(l=>vehicleWakeLock=l).catch(()=>{}); }
  vehicleWatchId = navigator.geolocation.watchPosition(handleVehiclePosition, handleVehicleError,
    { enableHighAccuracy:true, maximumAge:0, timeout:8000 });
}

function stopVehicleTracking(){
  if(vehicleWatchId!==null){ navigator.geolocation.clearWatch(vehicleWatchId); vehicleWatchId=null; }
  if(vehicleWakeLock){ vehicleWakeLock.release().catch(()=>{}); vehicleWakeLock=null; }
  document.getElementById('vehicleBtn').textContent = 'Takibi Başlat';
  document.getElementById('vehicleBtn').classList.remove('tracking');
  document.getElementById('vehicleStatusLine').textContent = 'Telefonu sabitle, ekranı açık tut.';
  setVehicleGauge(0);
}

function handleVehiclePosition(pos){
  const { latitude, longitude, speed, accuracy } = pos.coords;
  let kmh;
  if(speed!==null && speed!==undefined && !isNaN(speed)){ kmh = speed*3.6; }
  else if(vehicleLastPos){
    const dist = haversineMeters(vehicleLastPos.lat, vehicleLastPos.lon, latitude, longitude);
    const dt = (pos.timestamp - vehicleLastPos.t)/1000;
    kmh = dt>0.2 ? (dist/dt)*3.6 : 0;
  } else kmh = 0;
  if(isNaN(kmh) || kmh<0) kmh = 0;
  vehicleLastPos = { lat:latitude, lon:longitude, t:pos.timestamp };
  vehicleMaxKmh = Math.max(vehicleMaxKmh, kmh);
  setVehicleGauge(kmh);
  document.getElementById('vehicleMax').textContent = Math.round(vehicleMaxKmh);
  document.getElementById('vehicleAcc').textContent = '±' + Math.round(accuracy) + 'm';
  document.getElementById('vehicleStatusLine').textContent = kmh<3 ? 'Duruyorsun ya da çok yavaşsın.' : 'Canlı GPS hızı.';
}

function handleVehicleError(err){
  const note = document.getElementById('vehicleStatusLine');
  const msgs = { 1:'Konum izni reddedildi.', 2:'GPS sinyali alınamıyor.', 3:'Zaman aşımı, tekrar deneniyor…' };
  note.textContent = msgs[err.code] || 'Konum hatası.'; note.classList.add('err');
  if(err.code===1) stopVehicleTracking();
}

/* ===== Internet speed test ===== */
async function measurePing(){
  const s=[];
  for(let i=0;i<3;i++){
    const t0=performance.now();
    await fetch(`https://speed.cloudflare.com/__down?bytes=0&x=${Date.now()}-${i}`, {cache:'no-store'});
    s.push(performance.now()-t0);
  }
  return Math.min(...s);
}
async function measureDownload(onProgress){
  const bytes = 20_000_000;
  const t0 = performance.now();
  const res = await fetch(`https://speed.cloudflare.com/__down?bytes=${bytes}&x=${Date.now()}`, {cache:'no-store'});
  const buf = await res.arrayBuffer();
  const seconds = (performance.now()-t0)/1000;
  return (buf.byteLength*8)/seconds/1_000_000;
}
async function measureUpload(){
  const bytes = 6_000_000;
  const data = new Blob([new Uint8Array(bytes)]);
  const t0 = performance.now();
  await fetch('https://speed.cloudflare.com/__up', { method:'POST', body:data, cache:'no-store' });
  const seconds = (performance.now()-t0)/1000;
  return (bytes*8)/seconds/1_000_000;
}
async function runSpeedTest(){
  const btn=document.getElementById('speedBtn'), line=document.getElementById('speedStatusLine'), bar=document.getElementById('netProgress');
  btn.disabled=true; line.classList.remove('err');
  document.getElementById('pingValue').textContent='—';
  document.getElementById('downValue').textContent='—';
  document.getElementById('uploadValue').textContent='—';
  bar.style.width='5%';
  try{
    line.textContent='Gecikme ölçülüyor…';
    const ping = await measurePing();
    document.getElementById('pingValue').textContent = ping.toFixed(0);
    bar.style.width='30%';

    line.textContent='İndirme test ediliyor…';
    const down = await measureDownload();
    document.getElementById('downValue').textContent = down.toFixed(down<10?2:1);
    bar.style.width='70%';

    line.textContent='Yükleme test ediliyor…';
    const up = await measureUpload();
    document.getElementById('uploadValue').textContent = up.toFixed(1);
    bar.style.width='100%';

    line.textContent = 'Son ölçüm: ' + new Date().toLocaleTimeString('tr-TR');
  }catch(e){
    line.textContent='Test başarısız oldu.'; line.classList.add('err');
  }finally{ btn.disabled=false; }
}

/* ===== Location + weather ===== */
function getLocation(){
  const btn=document.getElementById('locBtn'), line=document.getElementById('locStatusLine');
  line.classList.remove('err');
  if(!navigator.geolocation){ line.textContent='Konum desteklenmiyor.'; line.classList.add('err'); return; }
  btn.disabled=true; line.textContent='Konum isteniyor…';
  navigator.geolocation.getCurrentPosition(async(pos)=>{
    const {latitude, longitude} = pos.coords;
    document.getElementById('locResult').style.display='block';
    document.getElementById('latVal').textContent = latitude.toFixed(5);
    document.getElementById('lonVal').textContent = longitude.toFixed(5);
    line.textContent=''; btn.disabled=false;
    try{
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=12`);
      const j = await r.json(); const addr = j.address || {};
      document.getElementById('placeName').textContent = addr.suburb||addr.town||addr.city||addr.county||j.name||'Bilinmeyen konum';
      document.getElementById('placeCountry').textContent = [addr.state, addr.country].filter(Boolean).join(', ') || '—';
    }catch(e){}
    fetchWeather(latitude, longitude);
  }, (err)=>{
    btn.disabled=false;
    const msgs={1:'Konum izni reddedildi.',2:'Konum alınamıyor.',3:'Zaman aşımı.'};
    line.textContent = msgs[err.code] || 'Konum alınamadı.'; line.classList.add('err');
  }, { enableHighAccuracy:true, timeout:12000 });
}

const WEATHER_ICONS = {
  clear:`<svg viewBox="0 0 24 24" fill="none" stroke="#FFB020" stroke-width="1.6"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>`,
  cloud:`<svg viewBox="0 0 24 24" fill="none" stroke="#84878C" stroke-width="1.6"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4-1.5A5 5 0 0 0 6.5 19h11Z"/></svg>`,
  rain:`<svg viewBox="0 0 24 24" fill="none" stroke="#00E5FF" stroke-width="1.6"><path d="M16 13a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.5-1.5A4.5 4.5 0 0 0 6 13h10Z"/><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2"/></svg>`,
  snow:`<svg viewBox="0 0 24 24" fill="none" stroke="#F5F6F7" stroke-width="1.6"><path d="M16 13a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.5-1.5A4.5 4.5 0 0 0 6 13h10Z"/><path d="M9 18v4M9 20l-2 1M9 20l2 1M15 18v4M15 20l-2 1M15 20l2 1"/></svg>`,
  storm:`<svg viewBox="0 0 24 24" fill="none" stroke="#FF3B30" stroke-width="1.6"><path d="M16 11a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.5-1.5A4.5 4.5 0 0 0 6 11h10Z"/><path d="M11 13l-2 5h3l-1 4 4-6h-3l1-3z"/></svg>`
};
function weatherFromCode(code){
  if([0,1].includes(code)) return {icon:'clear', desc:'Açık'};
  if([2,3].includes(code)) return {icon:'cloud', desc:'Parçalı bulutlu'};
  if([45,48].includes(code)) return {icon:'cloud', desc:'Sisli'};
  if([51,53,55,61,63,65,80,81,82].includes(code)) return {icon:'rain', desc:'Yağmurlu'};
  if([71,73,75,77,85,86].includes(code)) return {icon:'snow', desc:'Karlı'};
  if([95,96,99].includes(code)) return {icon:'storm', desc:'Gök gürültülü'};
  return {icon:'cloud', desc:'Bulutlu'};
}
async function fetchWeather(lat, lon){
  try{
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
    const j = await r.json(); const cw = j.current_weather; const info = weatherFromCode(cw.weathercode);
    document.getElementById('weatherTemp').textContent = Math.round(cw.temperature);
    document.getElementById('weatherDesc').textContent = info.desc + ' · ' + Math.round(cw.windspeed) + ' km/s rüzgar';
    document.getElementById('weatherIconBox').innerHTML = WEATHER_ICONS[info.icon];
    document.getElementById('weatherMini').style.display = 'flex';
  }catch(e){}
}

/* ===== ISP + Device ===== */
async function loadIspInfo(){
  try{
    const r = await fetch('https://ipapi.co/json/'); const j = await r.json();
    document.getElementById('ipAddr').textContent = j.ip || '—';
    document.getElementById('ipOrg').textContent = j.org || '—';
  }catch(e){
    document.getElementById('ipAddr').textContent = 'Alınamadı';
  }
}
function loadDeviceInfo(){
  const box = document.getElementById('deviceRows');
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  box.innerHTML = `
    <div class="row"><span class="k">Cihaz</span><span class="v">${isIOS?'iPhone (Safari)':'Algılanamadı'}</span></div>
    <div class="row"><span class="k">Ekran</span><span class="v">${window.screen.width}×${window.screen.height} @ ${window.devicePixelRatio}x</span></div>
    <div class="row"><span class="k">İşlemci çekirdeği</span><span class="v">${navigator.hardwareConcurrency||'—'}</span></div>
    <div class="row"><span class="k">Dil</span><span class="v">${navigator.language||'—'}</span></div>
    <div class="row"><span class="k">Pil durumu</span><span class="v" id="batteryRow">Kontrol ediliyor…</span></div>
  `;
  if('getBattery' in navigator){
    navigator.getBattery().then(b=>{
      document.getElementById('batteryRow').textContent = Math.round(b.level*100)+'%'+(b.charging?' · şarj oluyor':'');
    }).catch(()=>{ document.getElementById('batteryRow').textContent='Desteklenmiyor'; });
  } else {
    document.getElementById('batteryRow').textContent = 'Desteklenmiyor (Safari)';
  }
}

loadIspInfo();
loadDeviceInfo();
</script>
